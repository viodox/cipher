name: Daily CIPHER Tweet
on:
  schedule:
    # Roobet slots (every 3h starting 0 UTC = 7pm EST)
    - cron: '0 0 * * *'    # 7pm EST — Roobet
    - cron: '0 3 * * *'    # 10pm EST — Roobet
    - cron: '0 6 * * *'    # 1am EST — Roobet
    - cron: '0 9 * * *'    # 4am EST — Roobet
    - cron: '0 12 * * *'   # 7am EST — Roobet
    - cron: '0 15 * * *'   # 10am EST — Roobet
    - cron: '0 18 * * *'   # 1pm EST — Roobet
    - cron: '0 21 * * *'   # 4pm EST — Roobet
    # CIPHER slots (every 3h starting 1 UTC = 8pm EST)
    - cron: '0 1 * * *'    # 8pm EST — CIPHER
    - cron: '0 4 * * *'    # 11pm EST — CIPHER
    - cron: '0 7 * * *'    # 2am EST — CIPHER
    - cron: '0 10 * * *'   # 5am EST — CIPHER
    - cron: '0 13 * * *'   # 8am EST — CIPHER
    - cron: '0 16 * * *'   # 11am EST — CIPHER
    - cron: '0 19 * * *'   # 2pm EST — CIPHER
    - cron: '0 22 * * *'   # 5pm EST — CIPHER
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Post daily tweet
        run: node bot.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
