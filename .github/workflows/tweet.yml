name: Daily CIPHER Tweet
on:
  schedule:
    # Offset to :17 and :47 minutes to avoid GitHub's high-load hourly congestion
    # This prevents dropped/duplicate runs. All times below in EST.
    # Roobet slots (every 3h at :17)
    - cron: '17 0 * * *'    # 7:17pm EST — Roobet
    - cron: '17 3 * * *'    # 10:17pm EST — Roobet
    - cron: '17 6 * * *'    # 1:17am EST — Roobet
    - cron: '17 9 * * *'    # 4:17am EST — Roobet
    - cron: '17 12 * * *'   # 7:17am EST — Roobet
    - cron: '17 15 * * *'   # 10:17am EST — Roobet
    - cron: '17 18 * * *'   # 1:17pm EST — Roobet
    - cron: '17 21 * * *'   # 4:17pm EST — Roobet
    # CIPHER slots (every 3h at :47)
    - cron: '47 1 * * *'    # 8:47pm EST — CIPHER
    - cron: '47 4 * * *'    # 11:47pm EST — CIPHER
    - cron: '47 7 * * *'    # 2:47am EST — CIPHER
    - cron: '47 10 * * *'   # 5:47am EST — CIPHER
    - cron: '47 13 * * *'   # 8:47am EST — CIPHER
    - cron: '47 16 * * *'   # 11:47am EST — CIPHER
    - cron: '47 19 * * *'   # 2:47pm EST — CIPHER
    - cron: '47 22 * * *'   # 5:47pm EST — CIPHER
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Post daily tweet
        run: node bot.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
