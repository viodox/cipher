name: Daily CIPHER Tweet
on:
  schedule:
    # Offset to :17 and :47 to avoid GitHub's hourly congestion.
    # Every slot posts a CIPHER market note. Casino referrals were removed.
    - cron: '17 0 * * *'
    - cron: '17 2 * * *'
    - cron: '17 4 * * *'
    - cron: '17 6 * * *'
    - cron: '17 8 * * *'
    - cron: '17 12 * * *'
    - cron: '17 14 * * *'
    - cron: '17 16 * * *'
    - cron: '17 20 * * *'
    - cron: '17 22 * * *'
    - cron: '47 1 * * *'
    - cron: '47 5 * * *'
    - cron: '47 10 * * *'
    - cron: '47 13 * * *'
    - cron: '47 18 * * *'
    - cron: '47 23 * * *'
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Post daily tweet
        run: node bot.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
