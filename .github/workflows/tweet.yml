name: Daily CIPHER Tweet
on:
  schedule:
    # Offset to :17 and :47 minutes to avoid GitHub's high-load hourly congestion
    # 10 ROOBET slots per day (every 2h at :17 past peak degen hours)
    - cron: '17 0 * * *'    # 7:17pm EST — Roobet
    - cron: '17 2 * * *'    # 9:17pm EST — Roobet
    - cron: '17 4 * * *'    # 11:17pm EST — Roobet
    - cron: '17 6 * * *'    # 1:17am EST — Roobet
    - cron: '17 8 * * *'    # 3:17am EST — Roobet
    - cron: '17 12 * * *'   # 7:17am EST — Roobet
    - cron: '17 14 * * *'   # 9:17am EST — Roobet
    - cron: '17 16 * * *'   # 11:17am EST — Roobet
    - cron: '17 20 * * *'   # 3:17pm EST — Roobet
    - cron: '17 22 * * *'   # 5:17pm EST — Roobet
    # 6 CIPHER slots per day (at :47 past off-hours)
    - cron: '47 1 * * *'    # 8:47pm EST — CIPHER
    - cron: '47 5 * * *'    # 12:47am EST — CIPHER
    - cron: '47 10 * * *'   # 5:47am EST — CIPHER
    - cron: '47 13 * * *'   # 8:47am EST — CIPHER
    - cron: '47 18 * * *'   # 1:47pm EST — CIPHER
    - cron: '47 23 * * *'   # 6:47pm EST — CIPHER
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Post daily tweet
        run: node bot.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
